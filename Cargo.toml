[package]
name = "lojban"
version = "0.44.0"
edition = "2021"
rust-version = "1.74"
description = "A Lojban (constructed language) PEG parser library and CLI, ported from zantufa grammar"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["lojban", "parser", "peg", "language", "grammar"]
categories = ["text-processing", "parser-implementations"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parse"
harness = false

[dependencies]
pest = "2"
pest_derive = "2"
clap = { version = "4", features = ["derive"] }

[lib]
name = "lojban"
path = "src/lib.rs"

[[bin]]
name = "lojban"
path = "src/main.rs"
