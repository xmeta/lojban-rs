[package]
name = "lojban"
version = "0.103.0"
edition = "2021"
# 実効 MSRV は依存 pest 2.9 の要求(1.83)に従う。1.74 宣言は実測と不一致だった
rust-version = "1.83"
description = "A Lojban (constructed language) PEG parser library and CLI, ported from zantufa grammar"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/xmeta/lojban-rs"
keywords = ["lojban", "parser", "peg", "language", "grammar"]
categories = ["text-processing", "parser-implementations"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parse"
harness = false

[dependencies]
pest = "2"
pest_derive = "2"
clap = { version = "4", features = ["derive"] }

[lib]
name = "lojban"
path = "src/lib.rs"

[[bin]]
name = "lojban"
path = "src/main.rs"
